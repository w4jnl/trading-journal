server:
  port: 8080

database:
  path: "./data/trading.db"

imports:
  root: "./imports"

# Daily Open Interest dashboards (HTML + PDF pairs named
# dashboard-YYYY-MM-DD.{html,pdf}) dropped by an external pipeline.
# /oi lists everything in this folder and serves the latest by default.
oi_dashboards:
  root: "./oi_dashboard"

# Periodic backup. When enabled, the app writes one tar.gz snapshot at
# startup (skipped if today's already exists) and one daily at `hour`
# local time into `dir`. Each archive holds a consistent SQLite copy
# (VACUUM INTO), the attachments dir, the imports processed/failed audit
# trail, and config.yaml. Retention keeps the 10 newest archives plus one
# per calendar month forever. NOTE: archives include config.yaml's
# session secret -- protect `dir` with filesystem permissions.
backup:
  enabled: true
  dir: "./backups"
  hour: 4 # 0-23, local server time

# Trade-replay charts. Candlestick market context around a trade's entry/exit,
# with the fills overlaid as arrow markers. Bars come from Yahoo Finance v8
# (free, no API key); only continuous front-month futures are available, so the
# candle basis differs slightly from a dated contract (the overlaid fills are
# exact). Bars are cached in the DB; after each import a background worker warms
# the cache for the touched accounts so charts render instantly on first view.
market_data:
  # "yahoo" (default) or "" to use the default. No other source in v1.
  source: "yahoo"
  # Leave blank for the public endpoint; override only for testing.
  yahoo_base_url: ""
  # Outbound fetch timeout, seconds. Default 10.
  http_timeout_sec: 10
  # enabled: false hides charts entirely. prefetch: false keeps charts but
  # makes them lazy (the "Load chart" button) with no warm-on-import worker.
  # Both default to true when omitted.
  # enabled: true
  # prefetch: true
  # The current day ("today") is cached + auto-rendered and persists across
  # reopens; it re-fetches only when older than this many minutes, so an
  # in-progress session stays reasonably current. Default 15.
  intraday_refresh_min: 15
  # Nightly catch-up at this local HH:MM: re-fetches the last couple of days (so
  # a session only seen mid-day is completed once it closes) and backfills any
  # missing recent days. Empty string disables it. Default "00:30".
  nightly_refresh: "00:30"

# Model Context Protocol (MCP) server for AI agents, at POST /mcp. When enabled
# (default true), it is authenticated by the SAME per-user API keys as /api -- so
# Claude Code, the Claude app, and ChatGPT can read trades + journal and
# create/append entries with the key held in the connector config, never in a
# prompt. The bundled `trading-journal-analyst` skill drives it. See API.md.
# Set enabled: false to turn it off (the REST API at /api is unaffected).
mcp:
  enabled: true
  # Optional label (e.g. "prod" / "dev") reported by the MCP server_info tool so
  # an AI client configured with several connectors can tell instances apart.
  instance_label: ""
  # Built-in OAuth 2.1 authorization server for /mcp. Lets connectors that cannot
  # hold a static API key (ChatGPT's MCP connector, claude.ai custom connectors,
  # Claude Code's `claude mcp add --transport http`) sign in through the app:
  # they register themselves, you approve them once behind your normal login,
  # and the resulting tokens are accepted on /mcp only. tj_ API keys keep
  # working for /api/v1 and /mcp regardless. Off unless enabled here.
  # See docs/mcp-oauth-setup.md for the reverse-proxy routing this needs.
  oauth:
    enabled: false
    # Public origin the connectors reach the app on. Written into the discovery
    # documents, so it must equal the URL they fetch them from. https required
    # (plain http only for localhost during development).
    issuer: ""
    # Show a one-click approval page naming the client before issuing a code.
    # Keep on: anyone can register a client, so with auto-approve a crafted link
    # could mint a token for a signed-in user unnoticed.
    consent: true
    access_token_ttl_sec: 3600       # 1 hour; clients refresh silently
    refresh_token_ttl_sec: 2592000   # 30 days idle before a client must re-login
    code_ttl_sec: 60                 # raise to 120 if a client is slow to exchange
    # Optional allow-list of https hosts clients may register as redirect
    # targets. Loopback http (Claude Code) is always allowed. Empty = any https.
    allowed_redirect_hosts: []

# In-app AI analysis (server-side). When enabled, the app calls an AI endpoint to
# generate journal analyses itself -- the inward counterpart to the MCP server (which
# lets EXTERNAL AIs do it). It speaks the OpenAI chat-completions format, so it works
# with a local MLX server, OpenAI, OpenRouter and other aggregators, LM Studio, vLLM,
# etc. Disabled by default.
ai:
  enabled: false
  # Only "openai" (OpenAI-compatible) for now.
  provider: "openai"
  # Chat-completions base URL. Default points at a local MLX server; for OpenAI use
  # "https://api.openai.com/v1", for OpenRouter "https://openrouter.ai/api/v1".
  base_url: "http://0.0.0.0:8080/v1"
  # Model id the endpoint serves (local model name, "gpt-4o-mini",
  # "anthropic/claude-3.5-sonnet" on OpenRouter, ...).
  model: ""
  # Bearer key (blank for a local server). Override with the TJ_AI_API_KEY env var so
  # you can keep this file in git and inject the secret at runtime.
  api_key: ""
  # Per-request timeout (seconds), max output tokens, sampling temperature.
  timeout_sec: 120
  max_tokens: 1024
  temperature: 0.4
  # Optional extra request headers (e.g. OpenRouter's HTTP-Referer / X-Title).
  headers: {}

# Gamma-exposure context (gex-engine). During daily review prep, each ES/NQ
# trade/group entry gets a gamma block appended once: regime + percentile,
# side of / distance to the gamma flip, and tick distances to the call/put
# walls, from the engine snapshot that was live at the trade's entry and exit
# times. Other symbols and pre-history days are skipped silently; the fetch
# never blocks or fails a review. Also powers the Market > Gamma (GEX) page
# (live/as-of regime, levels, and the strike profile chart). Disabled by
# default.
gex:
  enabled: false
  # gex-engine base URL. Local dev: "http://127.0.0.1:8420"; Docker on the
  # shared network: "http://gex-engine:8420" (direct container-to-container).
  base_url: ""
  # Bearer token = the engine's GEX_API_TOKEN. Override with the
  # TJ_GEX_API_KEY env var to keep this file in git.
  api_key: ""
  # Per-request timeout (seconds). Kept short: annotation runs inside the
  # prepare-day path and must not stall reviews when the engine is down.
  timeout_sec: 5

# TopstepX (ProjectX Gateway) API sync. Users connect their own TopstepX
# username + API key in Settings; trades then sync automatically on page
# visits (throttled) and hourly during CME Globex hours. The feature turns on
# only when encryption_key is set -- per-user API keys are stored AES-256-GCM
# encrypted under it. Generate one with `openssl rand -hex 32` and BACK IT UP
# with this file: losing it means every user must re-enter their credentials.
topstepx:
  # enabled: false           # uncomment to force-disable with the key still set
  base_url: "https://api.topstepx.com"
  # 64 hex chars (32 bytes). Env override: TJ_TOPSTEPX_ENC_KEY.
  encryption_key: ""
  http_timeout_sec: 15
  # Minimum minutes between page-visit-triggered syncs per user.
  sync_throttle_min: 15
  # Read-triggered sync for consumer apps: a JSON API / MCP read of trades,
  # stats or the data version nudges a sync, at most once per this many
  # seconds per user (the sync is asynchronous; new fills then bump
  # /api/v1/version). 0 disables the trigger.
  api_sync_throttle_sec: 60
  # Scheduled sync cadences (minutes; 0 disables a tier):
  #  - session_sync_min runs during CME Globex trading hours (Sun 17:00 -
  #    Fri 16:00 Chicago, minus the daily 16:00-17:00 break, Sat off).
  #  - rth_sync_min speeds up inside rth_window (Mon-Fri, Chicago time);
  #    the default window is equity-futures RTH 08:30-15:00 CT plus one
  #    hour before and after.
  session_sync_min: 60
  rth_sync_min: 15
  rth_window: "07:30-16:00"

# IBKR live sync via Client Portal Gateway(s). Gateways themselves (URL, TLS
# mode) are per-user data added in Settings -- a gateway belongs to a journal
# user, one per IB login, and holds no secrets: its session is established by
# logging in on the gateway's own browser page (2FA). The app polls the
# rolling 7-day trade window, keeps sessions alive (tickle), silently
# reauthenticates dropped brokerage sessions, and shows "needs login" when
# the SSO session expires. MotiveWave rows for live-synced accounts are
# filtered from imports past the per-account cutover to prevent
# double-counting (see the account's "Live sync" menu on /accounts).
ibkr:
  enabled: true
  tickle_sec: 60         # per-gateway keep-alive; 0 disables
  # Scheduling mirrors topstepx: a page-visit throttle plus a two-tier
  # cadence gated to CME Globex hours (silent overnight/weekends). Minutes;
  # 0 disables a tier.
  sync_throttle_min: 15  # min minutes between page-visit-triggered syncs per user
  api_sync_throttle_sec: 60  # max one read-triggered (JSON API / MCP) sync per user per N seconds; 0 disables
  session_sync_min: 60   # cadence during Globex hours (Sun 17:00 - Fri 16:00 CT, minus the daily break)
  rth_sync_min: 15       # faster cadence inside rth_window
  rth_window: "07:30-16:00"  # Chicago time, Mon-Fri (RTH 08:30-15:00 CT +/- 1h)
  # Gateway hosts non-admin users may register (hostnames, IPs or CIDRs).
  # The server calls the gateway URL itself, so this is the SSRF boundary;
  # admins can register any host. Empty = only admins can add gateways.
  # allowed_gateway_hosts: ["ibgw.example.internal", "192.168.30.0/24"]

# MotiveWave email capture + ingest: an embedded SMTP listener for MW's
# "Send Email On Filled Order" notifications (Preferences -> Orders). Point
# MW's mail settings at this host instead of a real mail provider. Every
# message is archived verbatim to archive_dir; complete fill notifications
# are additionally ingested as PROVISIONAL executions (shown as
# "email - provisional" on /admin/transactions), giving near-real-time fills
# for accounts without an API connector. The MotiveWave CSV export remains
# authoritative: importing it replaces provisional rows exactly, matched on
# (account, order id) -- so an end-of-day re-import never double-counts.
# Accounts already live-synced via a broker API (IBKR) ignore their email
# copies automatically. LAN/VPN only: never expose this listener publicly.
#
# MotiveWave infers encryption from the port it dials: 25 = plain,
# 465 = implicit TLS, 587 = STARTTLS -- match tls_mode to the port you give
# MW (a nonstandard port like 2525 is treated as plain). MW applies mail
# settings only after a FULL restart (Apply -> OK -> restart -> Send Test
# Email).
mw_email:
  enabled: false
  listen_addr: ":2525"       # bind the LAN/Tailscale interface, never WAN
  tls_mode: "off"            # off | implicit | starttls
  # tls_cert: ""             # PEM paths; required unless tls_mode=off
  # tls_key: ""
  # smtp_username: ""        # both set => AUTH (PLAIN/LOGIN) required
  # smtp_password: ""
  archive_dir: "data/mw-raw" # verbatim .eml audit trail + parser corpus
  # ingest: true             # false = capture/archive only, no DB writes

# Trading timezone -- used for day boundaries on calendar/dashboard.
# Storage is always UTC.
timezone: "America/Chicago"

# Housekeeping for the sync history (Settings/Dashboard "last sync" panels read
# it). API polls write one sync_log row per account, thousands a day. Rows that
# added nothing and did not error are purged after this many days; rows that
# added fills or errored stay 90 days; the newest row per type and per account
# and all CSV import rows are kept forever. 0 keeps everything (not advised:
# the dashboard slows down as the table grows).
sync_log_retention_days: 2

# Authentication. The app is multi-user; every request resolves to a user
# row, even on a single-trader deploy where there's only one of them.
auth:
  # "local" runs the built-in login UI with bcrypt-hashed passwords and
  # sqlite-backed sessions. "proxy" is reserved for a future phase where
  # a reverse proxy (Authelia, oauth2-proxy, Caddy forward_auth) sets a
  # Remote-User header.
  mode: "local"

  # Username assigned ownership of all pre-multiuser data on the very
  # first start (when the multiuser migration runs). Must exist on first
  # boot; after that the value is mostly inert -- it's also the username
  # the "users reset <name>" command targets in the most common case.
  bootstrap_user: "admin"

  # HMAC key for CSRF tokens, session-id binding, and the admin act-as
  # cookie. Any string >= 32 bytes is fine; for binary randomness prefix
  # with "base64:" and pass a base64-encoded value. If empty the server
  # generates an ephemeral key at startup (with a WARN) -- tokens then
  # do not survive a restart.
  #
  # Can be overridden by the TJ_SESSION_SECRET environment variable so
  # you can check this file into git and inject the real secret via
  # Docker secrets / systemd EnvironmentFile / etc. Env wins over file.
  session_secret: ""

  # Session lifetime, hours. Default 168 (7 days).
  session_ttl_hours: 168

  # Mark the session cookie Secure (browser only sends it over HTTPS).
  # Default true. Flip to false ONLY for plain-HTTP deploys on a trusted
  # private network -- without TLS the cookie travels in cleartext.
  # cookie_secure: false

  # Proxy-mode settings (only consulted when mode = "proxy"). Phase 3.
  proxy:
    user_header: "Remote-User"
    email_header: "Remote-Email"
    display_name_header: "Remote-Name"
    groups_header: "Remote-Groups"
    admin_group: "admin"
    # CIDR allowlist for r.RemoteAddr -- requests that don't originate
    # from a trusted proxy are rejected before any header is read.
    trusted_proxies: []
    # Provision unknown users automatically on first sight. Convenient
    # for a single-tenant SSO where every authenticated identity should
    # have a journal account; flip to false if your SSO covers a wider
    # audience than the journal should serve, so a typo doesn't
    # silently grow your user list.
    auto_provision: true
    # Where /logout should redirect (your SSO logout URL). When unset,
    # /logout returns a stub page asking the user to sign out through
    # the SSO.
    logout_url: ""
