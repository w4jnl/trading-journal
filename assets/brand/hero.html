<!doctype html>
<!-- assets/brand/render.sh renders this to trading-journal-hero.png (1280x320) with headless
     Chrome. The lockup is trading-journal-lockup-tagline.svg inline, so the page's web font
     (the repo's own JetBrains Mono) applies to its text; no network is needed. -->
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:"JetBrains Mono";src:url("../../web/static/fonts/JetBrainsMono-Variable.woff2") format("woff2");font-weight:100 800}
  html,body{margin:0;width:1280px;height:320px;overflow:hidden;background:#14181A;color:#F2F5F5}
  .bar{position:absolute;left:0;top:0;width:6px;height:320px;background:#12999D}
  .lockup{position:absolute;left:72px;top:77px;width:1088px;height:166px}
  .lockup text:nth-of-type(2){font-size:6.4px}
</style></head><body><div class="bar"></div><div class="lockup"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 52" width="1088" height="166">
<g transform="translate(0 4) scale(0.171875)" fill="#12999D">
  <rect x="14" y="14" width="140" height="140" rx="28"/>
  <rect x="166" y="60" width="76" height="76" rx="16"/>
  <rect x="118" y="170" width="36" height="36" rx="8"/>
  <rect x="166" y="166" width="44" height="44" rx="9"/>
</g>
<text x="56" y="30" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="700" font-size="28" letter-spacing="-1" fill="#F2F5F5">trading-journal</text>
<text x="57" y="46" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#8A999C">self-hosted journal for futures traders</text>
</svg></div></body></html>
