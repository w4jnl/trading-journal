{{/*
Shared trade-detail modal markup + CSS. Pages include it via
{{template "trade_modal" .}} and supply their own `closeTradeModal()`
JS implementation — /trades has back/reload logic, /analytics just hides.
*/}}
{{define "trade_modal"}}
<div id="modal-backdrop" onclick="if (event.target === this) closeTradeModal()">
  <div class="modal">
    <button class="close-btn" onclick="closeTradeModal()">close</button>
    <div id="modal-content">loading…</div>
  </div>
</div>
<style>
  #modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.5);
                    display: none; align-items: center; justify-content: center; z-index: 100; }
  #modal-backdrop.show { display: flex; }
  .modal { background: white; border-radius: 8px; max-width: 800px; width: 90%;
           max-height: 85vh; overflow: auto; padding: 20px; }
  .modal h2 { margin-top: 0; }
  .close-btn { float: right; background: none; color: #475569; padding: 4px 8px; }
</style>
{{end}}
