{{define "title"}}Sign in — Trading Journal{{end}}

{{define "content"}}
<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <svg class="brand-mark" viewBox="0 0 256 256" aria-hidden="true">
        <rect x="14"  y="14"  width="140" height="140" rx="28" fill="currentColor"/>
        <rect x="166" y="60"  width="76"  height="76"  rx="16" fill="currentColor"/>
        <rect x="118" y="170" width="36"  height="36"  rx="8"  fill="currentColor"/>
        <rect x="166" y="166" width="44"  height="44"  rx="9"  fill="currentColor"/>
      </svg>
      <h1>Trading Journal</h1>
    </div>

    {{if .Error}}
    <div class="flash empty" role="alert" style="margin-bottom: 16px;">{{.Error}}</div>
    {{end}}

    <form method="post" action="/login" autocomplete="on">
      {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
      <label class="field" style="margin-bottom: 12px;">
        <span class="field-label">Username</span>
        <input name="username" value="{{.Username}}" required autofocus autocomplete="username">
      </label>
      <label class="field" style="margin-bottom: 16px;">
        <span class="field-label">Password</span>
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn--primary" style="width: 100%;">Sign in</button>
    </form>
  </div>
</div>

<style>
  .login-shell {
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
  }
  .login-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    color: var(--brand-teal, var(--accent));
  }
  .login-brand .brand-mark { width: 48px; height: 48px; }
  .login-brand h1 { margin: 0; font-size: 20px; font-weight: 600; color: var(--fg); }
  .login-card .field input {
    width: 100%;
    box-sizing: border-box;
  }
</style>
{{end}}
