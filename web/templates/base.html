{{define "base.html"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{block "title" .}}Trading Journal{{end}}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #f1f5f9; color: #0f172a; }
    nav { background: #0f172a; color: white; padding: 12px 20px; display: flex; gap: 18px; align-items: center; }
    nav a { color: white; text-decoration: none; opacity: 0.8; }
    nav a:hover { opacity: 1; }
    nav a.brand { font-weight: 600; opacity: 1; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
    h1 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background: #f8fafc; font-weight: 600; }
    .panel { background: white; border-radius: 6px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05); margin-bottom: 24px; }
    .panel.success { border-left: 4px solid #16a34a; }
    .panel.error { border-left: 4px solid #dc2626; }
    .muted { color: #64748b; font-size: 12px; }
    button { background: #0f172a; color: white; border: 0; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1e293b; }
    input[type=file] { font-size: 14px; }
    code { background: #f1f5f9; padding: 1px 5px; border-radius: 3px; font-size: 13px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .pill.success { background: #dcfce7; color: #166534; }
    .pill.error { background: #fee2e2; color: #991b1b; }
    /* Back button (shown when a cross-page deep link sets ?back=…). */
    .back-button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
                   background: #0f172a; color: white; border-radius: 4px;
                   text-decoration: none; font-size: 13px; margin-bottom: 12px; }
    .back-button:hover { background: #1e293b; }
    .back-button .hint { background: rgba(255,255,255,0.15); padding: 1px 5px; border-radius: 3px;
                         font-size: 10px; font-family: ui-monospace, SFMono-Regular, monospace; }
    /* Active nav menu item — bottom underline. */
    nav a.active { opacity: 1; border-bottom: 2px solid #38bdf8; padding-bottom: 2px; }
    /* Sketch-style icons. Color comes from the parent's `color`; SVG strokes inherit via currentColor. */
    .icon { display: inline-block; vertical-align: -3px; }
    .icon-journal.icon-empty   { color: #cbd5e1; }
    .icon-journal.icon-good    { color: #16a34a; }
    .icon-journal.icon-bad     { color: #dc2626; }
    .icon-journal.icon-neutral { color: #64748b; }
    /* Slight wobble on hover for the "hand-drawn" feel without overdoing it. */
    .icon-journal { transition: transform 120ms ease-out; }
    a:hover > .icon-journal,
    .trade-row:hover .icon-journal { transform: rotate(-2deg) translateY(-0.5px); }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand">Trading Journal</a>
    <a href="/trades"    class="{{if eq .NavActive "trades"}}active{{end}}">Trades</a>
    <a href="/calendar"  class="{{if eq .NavActive "calendar"}}active{{end}}">Calendar</a>
    <a href="/journal"   class="{{if eq .NavActive "journal"}}active{{end}}">Journal</a>
    <a href="/analytics" class="{{if eq .NavActive "analytics"}}active{{end}}">Analytics</a>
    <a href="/import"    class="{{if eq .NavActive "import"}}active{{end}}">Import</a>
    <a href="/accounts"  class="{{if eq .NavActive "accounts"}}active{{end}}">Accounts</a>
  </nav>
  <main>
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
{{end}}
