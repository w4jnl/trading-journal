{{/* Overview | Exposure tab switch, shared by both /gex pages. Preserves the
     market and, since engine v0.7.0 gave both tabs ?at= (same
     datetime-local format), the viewed moment. */}}
{{define "gex_tabs"}}
<div class="gex-seg">
  <a href="/gex{{if ne .Market "ES"}}/{{.Market}}{{end}}{{if .AtParam}}?at={{.AtParam}}{{end}}" class="{{if eq .GexTab "overview"}}active{{end}}">Overview</a>
  <a href="/gex/exposure{{if ne .Market "ES"}}/{{.Market}}{{end}}{{if .AtParam}}?at={{.AtParam}}{{end}}" class="{{if eq .GexTab "exposure"}}active{{end}}">Exposure</a>
</div>
{{end}}
