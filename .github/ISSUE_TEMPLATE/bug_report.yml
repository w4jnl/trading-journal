name: Bug report
description: Something the journal does wrong, with enough to reproduce it.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: One paragraph each. Say which page, import, sync or API call it concerns.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. drop this CSV into imports/inbox …
        2. open /trades …
        3. the trade shows …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The sidebar footer, or the image tag.
      placeholder: 2.18.5
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: How is it deployed?
      options:
        - Docker
        - docker compose
        - binary from source
        - the iOS app (say which server version too)
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Data source and sign-in mode
      placeholder: MotiveWave CSV plus fill e-mails, local sign-in
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: With account numbers, keys and addresses you do not want public removed.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A scrubbed CSV (replace the account refs, keep the rows), a screenshot, your config.yaml with secrets removed.
