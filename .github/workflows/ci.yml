name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # No standalone `go build ./...`: vet already type-checks the tree and
      # `go test -race ./...` compiles every package (including no-test ones),
      # so a separate build step is a redundant full-module compile.
      - name: test
        run: go test -race ./...

      # The committed sqlc output must match the queries; a stale regen
      # shows up as a diff here instead of as a runtime "no such column".
      - name: sqlc diff
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff

      # The release workflow only builds the image on a tag; build it here
      # too so a Dockerfile or asset-embedding break is caught on the PR.
      - name: docker build
        run: docker build -f Docker/Dockerfile --build-arg VERSION=ci -t trading-journal:ci .

  vulncheck:
    # Known-vulnerability scan of the dependency graph. Its own job so a new
    # advisory is visible without blocking unrelated work.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
