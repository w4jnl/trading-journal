# Trading Journal for iPhone and iPad: the Xcode project is generated from this file (brew
# install xcodegen; make ios-project). Local.xcconfig (gitignored) holds what is yours:
# TJ_TEAM_ID = your Apple team id, and TJ_ENTITLEMENTS = TradingJournal/TradingJournal.entitlements
# (pushes, time-sensitive alerts, the App Group and the keychain group the extensions share; a
# free Apple ID's personal team cannot sign that: leave it empty there). Shared/ is compiled
# into the app and its extensions: TJNotificationService puts the trade's chart on a push,
# TJNotificationContent is the expanded card with the live numbers and Seen in place, TJWidgets
# is the Session Live Activity and the Today widgets (TJ_WIDGET_ENTITLEMENTS: the App Group).
name: TradingJournal
options:
  bundleIdPrefix: nl.w4j
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The server's version scheme: the app ships with the release it was built against.
    MARKETING_VERSION: "2.18.6"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(TJ_TEAM_ID)
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  TradingJournal:
    type: application
    platform: iOS
    sources:
      - path: TradingJournal
      - path: Shared
    dependencies:
      - target: TJNotificationService
      - target: TJNotificationContent
      - target: TJWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.tradingjournal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_ENTITLEMENTS: $(TJ_ENTITLEMENTS)
    info:
      path: TradingJournal/Info.plist
      properties:
        CFBundleDisplayName: Trade Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        UIAppFonts: [Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf, JetBrainsMono-Regular.ttf, JetBrainsMono-Bold.ttf]
        NSCameraUsageDescription: Scan the pairing code shown in the journal's Settings.
        NSPhotoLibraryUsageDescription: Attach a photo to a journal note.
        NSFaceIDUsageDescription: Unlock the journal on this phone.
        NSAppTransportSecurity:
          # A journal on the home network (http://, a plain IP) must be reachable too.
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: nl.w4j.tradingjournal
            CFBundleURLSchemes: [tj]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
  TJNotificationService: # a closed trade's push gets the trade's chart as its attachment
    type: app-extension
    platform: iOS
    sources:
      - path: TJNotificationService
      - path: Shared/PushPayload.swift
      - path: Shared/API.swift
      - path: Shared/Keychain.swift
      - path: Shared/Wire.swift
      - path: Shared/Formatting.swift
      - path: Shared/Markdown.swift
      - path: Shared/Route.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.tradingjournal.NotificationService
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: TJNotificationService/TJNotificationService.entitlements
    info:
      path: TJNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Trade Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  TJNotificationContent: # the expanded card with the live numbers and Seen in place
    type: app-extension
    platform: iOS
    sources:
      - path: TJNotificationContent
      - path: Shared
    dependencies: # linked by hand: the extension's context class lives in UserNotificationsUI, and
      # without the link iOS cannot load the card (it crashes and shows the plain notification)
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.tradingjournal.NotificationContent
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: TJNotificationContent/TJNotificationContent.entitlements
    info:
      path: TJNotificationContent/Info.plist
      properties:
        CFBundleDisplayName: Trade Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf, JetBrainsMono-Regular.ttf, JetBrainsMono-Bold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: [TJ_NUDGE, TJ_POSITION, TJ_TRADE]
            UNNotificationExtensionInitialContentSizeRatio: 0.5
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionUserInteractionEnabled: true
  TJWidgets: # the Session Live Activity (Dynamic Island, Lock Screen) and the Today widgets
    type: app-extension
    platform: iOS
    sources:
      - path: TJWidgets
      - path: Shared/SessionActivity.swift
      - path: Shared/Privacy.swift
      - path: Shared/LiveViews.swift
      - path: Shared/TodayCache.swift
      - path: Shared/Grouping.swift
      - path: Shared/Brand.swift
      - path: Shared/Formatting.swift
      - path: Shared/Route.swift
      - path: Shared/Wire.swift
      - path: Shared/Markdown.swift
      - path: Shared/API.swift
      - path: Shared/Keychain.swift
      - path: Shared/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.tradingjournal.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: $(TJ_WIDGET_ENTITLEMENTS)
    info:
      path: TJWidgets/Info.plist
      properties:
        CFBundleDisplayName: Trade Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf, JetBrainsMono-Regular.ttf, JetBrainsMono-Bold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  TJTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TJTests
        excludes: [Payloads]
      - path: TJTests/Payloads # the simctl payload files, as resources (an unknown extension would be skipped)
        buildPhase: resources
    dependencies:
      - target: TradingJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.tradingjournal.tests
  TJScreens:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TJScreens
    dependencies:
      - target: TradingJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.w4j.tradingjournal.screens
        TEST_TARGET_NAME: TradingJournal
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TJScreens: # the screenshot walker (make ios-screens), apart from make ios-test
    build:
      targets:
        TJScreens: [test]
    test:
      config: Debug
      targets: [TJScreens]
  TradingJournal:
    build:
      targets:
        TradingJournal: all
        TJTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [TJTests]
    archive:
      config: Release
